name: Verify frozen L'ura API compatibility (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-lura-api-verification
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Test frozen API and migrations without deployment
        run: npm test
