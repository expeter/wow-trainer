name: Verify and deploy Midnight Season 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: midnight-season-2-pages
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  season-2-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium
      - name: Run focused Season 2 shell regression
        run: ./scripts/test-e2e-focused.sh season2-shell
      - name: Upload failed UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-season-2-shell
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: [unit-tests, season-2-shell]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone site
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Midnight Season 2 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
